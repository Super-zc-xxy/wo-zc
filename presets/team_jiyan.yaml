id: team_jiyan
name: 忌炎 · 青龙夜雨重击流（忌炎+莫特斐+维里奈）
description: 经典忌炎破阵队。莫特斐提供大招重击协同加成，忌炎变奏破阵入场，开大持续长按重击横扫全场。
features:
  auto_dialogue: true
  auto_combat: true
  auto_navigate: true
  auto_teleport: true
  auto_switch_quest: true
  auto_absorb_echo: true
  auto_popup_close: true
  auto_gadget: true
combat:
  exit_grace_sec: 2.5
  lock_on_key: middle
  use_concerto_switch: true
  use_ult_ready: true
  rotation:
  - action: key
    key: e
  - action: key
    key: r
  - action: hold_click
    duration: 1.2
  - action: click
    count: 3
    interval: 0.15
  - action: key
    key: q
  - action: dodge
  - action: switch_next
navigation:
  sprint_hold_sec: 0.5
  turn_sensitivity: 0.44
  center_deadzone_px: 65
  far_distance_m: 400
quest:
  priority_keywords:
  - 潮汐任务
  - 纪闻任务
