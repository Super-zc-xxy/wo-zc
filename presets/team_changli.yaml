id: team_changli
name: 长离 · 心眼离火双核流（长离+今汐/暗主+维里奈）
description: 极速切人合轴双核队。长离多段心眼突刺积攒四层离火，释放强力焚身以火与大招，打满延奏无缝切入二号位爆发。
features:
  auto_dialogue: true
  auto_combat: true
  auto_navigate: true
  auto_teleport: true
  auto_switch_quest: true
  auto_absorb_echo: true
  auto_popup_close: true
  auto_gadget: true
combat:
  exit_grace_sec: 2.5
  lock_on_key: middle
  use_concerto_switch: true
  use_ult_ready: true
  rotation:
  - action: key
    key: e
  - action: click
    count: 3
    interval: 0.12
  - action: hold_click
    duration: 0.5
  - action: key
    key: r
  - action: hold_click
    duration: 0.5
  - action: key
    key: q
  - action: dodge
  - action: switch_next
navigation:
  sprint_hold_sec: 0.45
  turn_sensitivity: 0.42
  center_deadzone_px: 65
  far_distance_m: 350
quest:
  priority_keywords:
  - 潮汐任务
  - 纪闻任务
