id: team_camellya
name: 椿 · 红椿狂热绽放流（椿+守岸人+散华）
description: 椿核心狂热输出队。守岸人增益、散华冰协同延奏，椿进场切形态高速旋转斩积满红椿蕊，长按狂热爆发大招收割。
features:
  auto_dialogue: true
  auto_combat: true
  auto_navigate: true
  auto_teleport: true
  auto_switch_quest: true
  auto_absorb_echo: true
  auto_popup_close: true
  auto_gadget: true
combat:
  exit_grace_sec: 2.6
  lock_on_key: middle
  use_concerto_switch: true
  use_ult_ready: true
  rotation:
  - action: key
    key: e
  - action: click
    count: 5
    interval: 0.11
  - action: hold_click
    duration: 0.65
  - action: key
    key: r
  - action: key
    key: q
  - action: dodge
  - action: switch_next
navigation:
  sprint_hold_sec: 0.45
  turn_sensitivity: 0.42
  center_deadzone_px: 65
  far_distance_m: 350
quest:
  priority_keywords:
  - 潮汐任务
  - 危行任务
