vision:
  default_threshold: 0.8
  ocr_interval_sec: 1.0
  auto_collect_templates: true
combat:
  exit_grace_sec: 2.5
  lock_on_key: middle
  use_concerto_switch: true
  use_ult_ready: true
  rotation:
  - action: click
    count: 3
    interval: 0.16
  - action: key
    key: e
  - action: click
    count: 2
    interval: 0.16
  - action: key
    key: q
  - action: key
    key: r
  - action: switch_next
navigation:
  sprint_hold_sec: 0.45
  turn_sensitivity: 0.42
  center_deadzone_px: 70
  far_distance_m: 300
  enable_teleport: true
logging:
  level: INFO
  save_dir: logs
  save_error_screenshot: true
