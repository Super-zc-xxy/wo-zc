  tick_interval: 0.15
  jitter_min: 0.05
  jitter_max: 0.13
  stuck_timeout_sec: 4.0
  max_unstuck_retries: 3
  state_timeout_sec: 45.0
  loading_dark_threshold: 18
  no_quest_switch_sec: 8.0
